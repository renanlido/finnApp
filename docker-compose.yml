services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finnapp
      POSTGRES_PASSWORD: finnapp
      POSTGRES_DB: finnapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
